<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simply Daily</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Lexend',sans-serif}
body{background:#eef7ff;}
.topbar{background:#123d63;color:#fff;padding:16px;text-align:center;font-weight:700;}
.screen{display:none;padding:20px;height:calc(100vh - 120px);overflow-y:auto;}
.active{display:block;}
.card{background:#fff;padding:20px;border-radius:20px;max-width:700px;margin:auto;box-shadow:0 10px 20px rgba(0,0,0,.1);}
button{margin-top:10px;padding:14px;width:100%;border:none;border-radius:12px;background:#1f6fb2;color:#fff;}
.back{background:#ccc;color:#000;}
img{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:10px;}
.result{background:#f4f9ff;padding:15px;margin-top:10px;border-radius:12px;}
textarea{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:1px solid #ccc;}
.diary-entry{background:#f4f9ff;margin-top:10px;padding:10px;border-radius:10px;}
.diary-entry small{color:#666;font-size:12px;}
.nav{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;display:flex;justify-content:space-around;}
</style>
</head>
<body>
<div class="topbar">Simply Daily</div>

<div id="home" class="screen active">
<div class="card">
<h2>Welcome</h2>
<p>Your wellbeing and body confidence space</p>
<button onclick="start()">Start Check-In</button>
<button onclick="nav('daily planner')">📔 Daily Planner</button>
<button onclick="nav('progress')">📊 Progress</button>
<button onclick="nav('support')">🆘 Support</button>
<button onclick="crisis()">🚨 I Need Help Now</button>
</div>
</div>

<div id="questions" class="screen">
<div class="card">
<button class="back" onclick="goBack()">⬅ Back</button>
<h3 id="qText"></h3>
<img id="qImg">
<div id="answers"></div>
</div>
</div>

<div id="results" class="screen">
<div class="card">
<button class="back" onclick="nav('home')">⬅ Home</button>
<h2>Your Personalised Plan</h2>
<div id="resultsBox"></div>
</div>
</div>

<div id="planner" class="screen">
<div class="card">
<button class="back" onclick="nav('home')">⬅ Home</button>
<h2>Your Daily Planner</h2>
<textarea id="plannerText"></textarea>
<button onclick="saveDiary()">Add Entry</button>
<div id="plannerList"></div>
</div>
</div>

<div id="progress" class="screen">
<div class="card">
<button class="back" onclick="nav('home')">⬅ Home</button>
<h2>Your Mood Progress</h2>
<canvas id="moodChart"></canvas>
</div>
</div>

<div id="support" class="screen">
<div class="card">
<button class="back" onclick="nav('home')">⬅ Home</button>
<h2>Support</h2>
<div class="result"><a href="https://www.nhs.uk/mental-health/" target="_blank">NHS Mental Health</a></div>
<div class="result"><a href="https://www.mind.org.uk" target="_blank">Mind UK</a></div>
<div class="result"><a href="https://www.beateatingdisorders.org.uk" target="_blank">Beat Eating Disorders</a></div>
<div class="result"><a href="https://www.youngminds.org.uk" target="_blank">Young Minds</a></div>
<div class="result">Samaritans: 116 123</div>
</div>
</div>

<div class="nav">
<button onclick="nav('home')">🏠</button>
<button onclick="nav('diary')">📔</button>
<button onclick="nav('progress')">📊</button>
<button onclick="nav('support')">🆘</button>
</div>

<script>
let qi=0, score=0, lowCount=0;
let userData={};

const questions=[
{q:"What is your age?",type:"input",field:"age"},
{q:"Gender?",type:"select",field:"gender",a:["Male","Female","Other"]},
{q:"What is your location? e.g fy1, fy4", type:"input", field:"location"},
{q:"Do you have SEN needs?",type:"select",field:"sen",a:["No","Yes"]},
{q:"Do you have children?",type:"select",field:"children",a:["No","Yes"]},

{q:"How do you feel about your body today?",img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330",a:[["Confident",2],["Unsure",1],["Negative",0]]},
{q:"Do you compare yourself to others?",img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e",a:[["Rarely",2],["Sometimes",1],["Often",0]]},
{q:"How kind are your thoughts?",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",a:[["Kind",2],["Mixed",1],["Critical",0]]},
{q:"How often do you feel anxious?",img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f",a:[["Rarely",2],["Sometimes",1],["Often",0]]},
{q:"How is your sleep?",img:"https://images.unsplash.com/photo-1505693314120-0d443867891c",a:[["Good",2],["Okay",1],["Poor",0]]},
{q:"Do you avoid mirrors or photos?",img:"https://images.unsplash.com/photo-1515378791036-0648a3ef77b2",a:[["No",2],["Sometimes",1],["Often",0]]}
];

function nav(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function start(){qi=0;score=0;lowCount=0;userData={};nav('questions');render();}

function render(){
 let q=questions[qi];
 qText.innerText=q.q;
 answers.innerHTML='';
 qImg.style.display=q.img?"block":"none";
 if(q.img) qImg.src=q.img;

 if(q.type==="input"){
  let i=document.createElement("input");i.type=q.field === "age" ? "number" : "text";
  let b=document.createElement("button");b.innerText="Next";
  b.onclick=()=>{userData[q.field]=i.value;qi++;render();};
  answers.appendChild(i);answers.appendChild(b);
 }
 else if(q.type==="select"){
  q.a.forEach(o=>{let b=document.createElement("button");b.innerText=o;b.onclick=()=>{userData[q.field]=o;qi++;render();};answers.appendChild(b);});
 }
 else{
  q.a.forEach(o=>{
   let b=document.createElement("button");
   b.innerText=o[0];
   b.onclick=()=>{
    score+=o[1];
    if(o[1]===0) lowCount++;

    if(lowCount>=3){earlySupport();return;}

    qi++;
    qi>=questions.length?showResults():render();
   };
   answers.appendChild(b);
  });
 }
}

function earlySupport(){
 nav('results');
 resultsBox.innerHTML=`
 <div class="result"><b>Let's pause here 💙</b><br>You’ve indicated you're having a tough time. That’s okay.</div>
 <div class="result">
 <b>Gentle Weekly Plan:</b><br>
 Mon: Rest + breathing<br>
 Tue: Talk to someone<br>
 Wed: Fresh air walk<br>
 Thu: Comfort activity<br>
 Fri: Small win<br>
 Sat: Light movement<br>
 Sun: Reset
 </div>`;
}

function showResults(){
 nav('results');
 let isParent=userData.children==="Yes";
 let hasSEN=userData.sen==="Yes";

 let plan=`<div class="result"><b>Your Personalised Week</b><br>
 Mon: Movement + goals<br>
 Tue: Social connection<br>
 Wed: Rest + journal<br>
 Thu: Creativity<br>
 Fri: Celebrate wins<br>
 Sat: Outdoor activity<br>
 Sun: Reset
 </div>`;

 plan+=`<div class="result"><b>Advice:</b><br>
 • Be kind to yourself<br>
 • Limit comparison
 • Prioritise sleep
 </div>`;

 if(isParent){plan+=`<div class="result"><b>Parent Ideas:</b><br>Walks, games, shared calm time</div>`;}
 if(hasSEN){plan+=`<div class="result"><b>SEN Support:</b><br>Routine, sensory calm activities</div>`;}

 resultsBox.innerHTML=plan;
}

function saveDiary(){
 let t=document.getElementById('diaryText').value;
 if(!t.trim())return;
 let e=JSON.parse(localStorage.getItem('entries')||"[]");
 e.push({text:t,date:new Date().toLocaleString()});
 localStorage.setItem('entries',JSON.stringify(e));
 document.getElementById('diaryText').value="";
 loadDiary();
}

function loadDiary(){
 let e=JSON.parse(localStorage.getItem('entries')||"[]");
 let l=document.getElementById('diaryList');l.innerHTML="";
 e.slice().reverse().forEach(x=>{l.innerHTML+=`<div class="diary-entry"><small>${x.date}</small><br>${x.text}</div>`;});
}

function renderChart(){
 let data=JSON.parse(localStorage.getItem('scores')||"[]");
 new Chart(document.getElementById('moodChart'),{type:'line',data:{labels:data.map((_,i)=>i+1),datasets:[{data:data}]}});
}

function crisis(){alert("If you are in danger call 999.\nSamaritans: 116 123\nText SHOUT to 85258");}

window.onload=()=>{loadDiary();renderChart();}
function goBack(){if(qi>0){qi--;render();}}
</script>
</body>
</html>
